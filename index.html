<style>
:root{--bg:#F3F7FE;--surface:#FFFFFF;--soft:#EEF3FF;--line:#DCE5F5;--ink:#0E1B3D;--muted:#5F6B88;
--blue:#1F4DD1;--onblue:#FFFFFF;--yellow:#FFD60A;--onyellow:#2A2000;--magenta:#E6007E;--onmagenta:#FFFFFF;
--ok:#12A150;--ring:rgba(31,77,209,.28);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080B14;--surface:#0F1424;--soft:#151C33;
--line:#232C47;--ink:#EAF0FF;--muted:#94A1C2;--blue:#4D7CFF;--onblue:#FFFFFF;--onmagenta:#1A0010;--magenta:#FF3DA1;
--ok:#3DDC84;--ring:rgba(77,124,255,.4);}}
:root[data-theme="dark"]{--bg:#080B14;--surface:#0F1424;--soft:#151C33;
--line:#232C47;--ink:#EAF0FF;--muted:#94A1C2;--blue:#4D7CFF;--onblue:#FFFFFF;--onmagenta:#1A0010;--magenta:#FF3DA1;
--ok:#3DDC84;--ring:rgba(77,124,255,.4);}

*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.stepper{display:flex;gap:6px;margin-bottom:24px}
.st{flex:1;display:flex;align-items:center;gap:8px;background:none;border:none;border-top:3px solid var(--line);
  padding:10px 0 0;text-align:left;color:var(--muted);font-size:12px;font-weight:700;min-width:0}
.st .n{width:20px;height:20px;border-radius:50%;background:var(--soft);display:flex;align-items:center;
  justify-content:center;font-size:10.5px;flex:none}
.st .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.active{border-top-color:var(--blue);color:var(--ink)}
.st.active .n{background:var(--blue);color:var(--onblue)}
.st.done{border-top-color:var(--yellow);color:var(--ink)}
.st.done .n{background:var(--blue);color:var(--onblue)}
.st:disabled{cursor:default}
@media(max-width:520px){.st .t{display:none}.st.active .t{display:inline}.st.active{flex:2.6}}
.title{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.title::after{content:"";display:block;width:58px;height:5px;margin-top:11px;border-radius:99px;
  background:linear-gradient(90deg,var(--yellow) 0 55%,var(--magenta) 55% 100%)}
.lead{margin:14px 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ai{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:14px;text-align:left;color:var(--ink);transition:border-color .12s,transform .12s,box-shadow .12s}
.ai:hover{border-color:var(--blue);transform:translateY(-1px)}
.ai.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.badge{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;flex:none}
.b0{background:var(--blue);color:var(--onblue)}.b1{background:var(--yellow);color:var(--onyellow)}
.b2{background:var(--magenta);color:var(--onmagenta)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt b{font-size:13.5px}
.txt i{font-style:normal;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.chip{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.chip.local{background:var(--yellow);color:var(--onyellow)}
.chip.hosted{background:var(--magenta);color:var(--onmagenta)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.one{grid-template-columns:1fr}
.choice{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:16px;color:var(--ink);transition:border-color .12s,transform .12s,box-shadow .12s}
.choice:hover{border-color:var(--blue);transform:translateY(-1px)}
.choice.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.choice .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.choice.local .ico{background:var(--yellow);color:var(--onyellow)}
.choice.hosted .ico{background:var(--magenta);color:var(--onmagenta)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.choice h3{margin:6px 0 0;font-size:17px}
.choice .sub{font-size:12px;font-weight:700;color:var(--blue)}
.choice p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
@media(max-width:560px){.choices{grid-template-columns:1fr}}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:0}
.svgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.svc{position:relative;display:flex;align-items:center;gap:11px;padding:11px 38px 11px 11px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;text-align:left;color:var(--ink)}
.svc img{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:none;background:var(--soft)}
.svc .nm{font-size:13px;font-weight:700;display:block}
.svc .tg{font-size:11px;color:var(--muted);display:block}
.svc .ck{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--line)}
.svc.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.svc.sel .ck{background:var(--blue);border-color:var(--blue)}
.svc.sel .ck::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--onblue);
  border-width:0 2px 2px 0;transform:rotate(45deg)}
.recapbox{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.rc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.rc span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
.rc b{font-size:14px;display:flex;align-items:center;gap:6px}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.minis img{width:30px;height:30px;border-radius:8px;border:1px solid var(--line)}
.plist{margin-top:16px;display:none}
.plist.show{display:block}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:var(--muted)}
.pl .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.pl.run{color:var(--ink)}
.pl.run .tick{border-color:var(--blue);border-top-color:transparent;animation:spin .7s linear infinite}
.pl.done{color:var(--ink)}
.pl.done .tick{background:var(--blue);border-color:var(--blue)}
.pl.done .tick::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--onblue);
  border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.donehead{display:flex;align-items:center;gap:16px;margin-bottom:4px}
.bigok{width:48px;height:48px;border-radius:50%;background:var(--blue);display:flex;align-items:center;
  justify-content:center;box-shadow:0 0 0 6px var(--ring);flex:none}
.bigok svg{width:24px;height:24px;stroke:var(--onblue);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.donehead .title{margin:0}
.dl{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 16px}
.dr{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);font-size:13px;font-weight:650}
.dr:last-child{border-bottom:none}
.dr img{width:26px;height:26px;border-radius:7px}
.dr .ok{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:700}
.dr .ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.next{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 14px}
details.tech{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--soft)}
details.tech summary{cursor:pointer;font-size:12.5px;font-weight:700}
.trow{display:flex;align-items:center;gap:8px;margin-top:9px}
.trow code{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:6px 9px;overflow:auto;white-space:nowrap}
.trow button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;
  padding:6px 10px;border-radius:7px;flex:none}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px}
.actions:empty{display:none}
.btn{border:none;border-radius:11px;padding:12px 22px;font-weight:700;font-size:14px;transition:transform .1s,opacity .1s}
.btn.primary{background:var(--blue);color:var(--onblue);margin-left:auto}
.btn.primary:hover{transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);
  border:1.5px solid var(--magenta);font-size:13px}
.msg.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.page{min-height:100dvh;display:grid;grid-template-columns:minmax(310px,38%) 1fr}
.side{position:relative;color:#fff;background:linear-gradient(165deg,#0A1B55 0%,#1F4DD1 100%);padding:46px 42px;
  display:flex;flex-direction:column;gap:26px;overflow:hidden}
.side::before{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,10,.30),transparent 65%)}
.side::after{content:"";position:absolute;left:-110px;bottom:-150px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(230,0,126,.40),transparent 65%)}
.side>*{position:relative;z-index:1}
.lockup{display:flex;align-items:center;gap:18px}
.logo{width:88px;height:88px;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.4);flex:none}
.word{font-size:52px;font-weight:800;letter-spacing:-.035em;line-height:1}
.subw{font-size:13px;font-weight:800;letter-spacing:.24em;color:var(--yellow);margin-top:9px}
.headline{font-size:clamp(22px,2.3vw,30px);font-weight:700;line-height:1.2;margin:0;max-width:16ch}
.bars{display:flex;gap:6px}.bars i{display:block;height:6px;border-radius:99px}
.bars i:nth-child(1){width:58px;background:var(--yellow)}.bars i:nth-child(2){width:30px;background:#FF3DA1}
.bars i:nth-child(3){width:14px;background:#fff}
.recap{margin-top:auto;display:grid;gap:10px}
.rrow{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:11px 15px;border-radius:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.rrow span{opacity:.75}.rrow b{font-weight:700;text-align:right}
.built{font-size:12px;opacity:.85}
.pane{display:flex;align-items:center;justify-content:center;padding:40px 36px;min-width:0}
.window{width:100%;max-width:620px}
@media(max-width:860px){.page{grid-template-columns:1fr}.side{padding:24px 20px;gap:14px}.logo{width:60px;height:60px;border-radius:15px}
  .word{font-size:35px}.headline{display:none}.recap{margin-top:0;display:flex;flex-wrap:wrap}.rrow{flex:1;min-width:140px}
  .pane{padding:24px 16px 40px}}

.sidenav{display:flex;gap:8px;flex-wrap:wrap}
.sidenav button{flex:1;min-width:84px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:#fff;
  border-radius:11px;padding:10px 12px;font-weight:700;font-size:13px}
.sidenav button:hover{background:rgba(255,255,255,.22)}
.chip.soon{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.choice.off{opacity:.6;cursor:not-allowed}
.choice.off:hover{border-color:var(--line);transform:none}
.soontag{align-self:flex-start;font-size:10.5px;font-weight:800;color:var(--muted);border:1px dashed var(--line);
  border-radius:999px;padding:2px 9px}
.sub3{font-size:14.5px;font-weight:800;margin:22px 0 8px}
.btnlink{display:inline-block;text-decoration:none;border:1.5px solid var(--line);color:var(--ink);font-size:11.5px;
  font-weight:700;padding:6px 11px;border-radius:8px;white-space:nowrap;background:var(--surface)}
.btnlink.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.dr .acts{margin-left:auto;display:flex;gap:6px}
a.btn{text-decoration:none;display:inline-block}
.btn.right{margin-left:auto}
.hb{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.hb .nm2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hb img{width:26px;height:26px;border-radius:7px}
pre.code{margin:0 0 10px;padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;max-height:250px}
.needs{margin:12px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.65}
.needs b{color:var(--ink)}
.tip{font-size:12.5px;color:var(--muted);line-height:1.6}
.tip code,.lead code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--soft);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
.shade{position:fixed;inset:0;background:rgba(5,10,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.shade.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(720px,64vw);background:var(--surface);border-left:1px solid var(--line);
  z-index:50;transform:translateX(102%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;display:flex;
  flex-direction:column;box-shadow:-24px 0 60px -24px rgba(0,0,0,.45)}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
@media(max-width:860px){.sheet{width:100%}}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:16px 14px 12px;font-weight:800;font-size:14px;color:var(--muted)}
.tab.active{color:var(--ink);border-bottom-color:var(--blue)}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;line-height:1}
.sheetbody{flex:1;overflow:auto;padding:24px 26px 44px}
.sheetbody h2{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.sheetbody h3{margin:26px 0 10px;font-size:15px;font-weight:800}
.sheetbody p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 10px}
.sheetbody code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--soft);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
.sheetbody a{color:var(--blue);font-weight:700}
details.srv,details.faq{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
details summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;align-items:center;gap:11px;font-weight:700;font-size:14px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-weight:800;color:var(--muted)}
details[open] summary::after{content:"-"}
details.srv summary img{width:30px;height:30px;border-radius:8px;flex:none}
details.srv summary i{display:block;font-style:normal;font-weight:500;font-size:12px;color:var(--muted)}
.kv{padding:0 14px 12px}
.kv span{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--blue);margin:11px 0 3px}
.kv p{margin:0}
details.faq .ans{padding:0 14px 14px}
details.faq .ans p{margin:0}
.contact{display:grid;gap:10px;margin:14px 0 6px}
.contact a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;background:var(--surface)}
.contact a span{font-size:11.5px;color:var(--muted);font-weight:700}
.contact a:hover{border-color:var(--blue)}
.sheetbody ul{margin:0 0 10px;padding-left:20px;color:var(--muted);font-size:14px;line-height:1.7}
</style></head>

function buildConfig(a,list){
  const o={};
  list.forEach(s=>{
    const e={command:'node',args:['C:\\path\\to\\'+s.folder+'\\dist\\index.js']};
    if(s.env&&Object.keys(s.env).length) e.env=s.env;
    o[s.slug]=e;
  });
  const w={}; w[a.k==='copilot'?'servers':'mcpServers']=o;
  return JSON.stringify(w,null,2);
}

}

function localGet(a){
  const list=chosen(); CFG=buildConfig(a,list);
  const note=a.k==='copilot'?' GitHub Copilot expects "servers" as the top-level key, so we have set that for you.':
    (a.k==='codex'||a.k==='zed')?' '+a.n+' uses its own settings format, so copy the command, args and env values into it.':'';
  const needs=list.filter(s=>s.cred).map(s=>'<li><b>'+s.name+':</b> '+s.needs+'</li>').join('');
  return '<h2 class="title">Get your servers</h2><p class="lead">Download, set up once, and '+a.n+' can use them.</p>'+recapBoxes(a)+
    '<h3 class="sub3">1. Download</h3><div class="dl">'+list.map(s=>'<div class="dr"><img src="'+s.icon+'" alt="">'+s.name+
      '<span class="acts"><a class="btnlink pri" href="https://download-directory.github.io/?url='+REPO+'/tree/main/'+s.folder+
      '" target="_blank" rel="noopener">Download .zip</a><a class="btnlink" href="'+REPO+'/tree/main/'+s.folder+
      '" target="_blank" rel="noopener">Source</a></span></div>').join('')+'</div>'+
    '<h3 class="sub3">2. Set up each one</h3><p class="lead" style="margin:0 0 10px">Unzip it, open a terminal in that folder and run these two commands. You need Node.js 18 or newer.</p>'+
    trow('npm install')+trow('npm run build')+
    '<h3 class="sub3">3. Add them to '+a.n+'</h3><p class="lead" style="margin:0 0 10px">Paste this into '+a.n+'\'s MCP settings, fix the paths, then fully restart it.'+note+'</p>'+
    '<pre class="code">'+esc(CFG)+'</pre><button class="btnlink" id="copyCfg">Copy settings</button>'+
    (needs?'<ul class="needs">'+needs+'</ul>':'')+
    '<p class="tip">Test any server first: run <code>npx @modelcontextprotocol/inspector node dist/index.js</code> in its folder.</p>';
}

function hostedGet(a){
  const list=chosen();
  return '<h2 class="title">Add your servers</h2><p class="lead">Paste each link into '+a.n+' as a remote (custom) connector. Some plans do not allow custom connectors, so check yours.</p>'+
    recapBoxes(a)+list.map(s=>{const u=HOSTED_BASE+'/'+s.slug;
      return '<div class="hb"><div class="nm2"><img src="'+s.icon+'" alt="">'+s.name+'</div>'+trow(u)+'</div>';}).join('');
}

function render(){
  const a=cur(), st=S.step;
  $('msg').classList.remove('show');
  $('stepper').innerHTML=STEPS.map((t,i)=>
    '<button class="st '+(i<st?'done':'')+' '+(i===st?'active':'')+'" data-i="'+i+'" '+(i<st?'':'disabled')+'>'+
    '<span class="n">'+(i<st?'\u2713':(i+1))+'</span><span class="t">'+t+'</span></button>').join('');
  $('stepper').querySelectorAll('.st:not(:disabled)').forEach(b=>b.onclick=()=>go(+b.dataset.i));

  let h='', acts='';
  if(st===0){
    h='<h2 class="title">Which AI do you use?</h2><p class="lead">Pick yours. We only show what it can connect to.</p><div class="aigrid">'+
      AIS.map((x,i)=>'<button class="ai '+(S.ai===x.k?'sel':'')+'" data-k="'+x.k+'"><span class="badge b'+(i%3)+'">'+x.l+
      '</span><span class="txt"><b>'+x.n+'</b><i>'+x.s+'</i></span><span class="chips">'+chips(x.m)+'</span></button>').join('')+'</div>';
    if(S.ai) acts='<button class="btn primary" id="nextBtn">Continue</button>';
  }
  if(st===1){
    const av=avail(a);
    if(av.length===0){
      h='<h2 class="title">Hosted is coming soon</h2><p class="lead">'+a.n+' connects to hosted servers only, and those are not live yet. '+
        'We can email you the moment they are, or you can pick another AI that runs servers on your computer.</p>';
      acts='<button class="btn ghost" id="backBtn">Choose another AI</button><a class="btn primary" id="notifyBtn" href="'+notifyHref(a)+'">Notify me</a>';
    }else if(a.m.length===1){
      h='<h2 class="title">Where it runs</h2><p class="lead">'+a.n+' connects to '+MODE[a.m[0]].toLowerCase()+
        ' servers only, so we have chosen that for you.</p><div class="choices one">'+choiceHtml(a.m[0],true,false)+'</div>';
      acts='<button class="btn ghost" id="backBtn">Back</button>'+(S.mode?'<button class="btn primary" id="nextBtn">Continue</button>':'');
    }else{
      h='<h2 class="title">Where should it run?</h2><p class="lead">'+a.n+' works both ways. '+
        (HOSTED_LIVE?'Pick one.':'Hosted is coming soon, so Local is the one to pick today.')+'</p><div class="choices">'+
        a.m.map(m=>choiceHtml(m,S.mode===m,m==='hosted'&&!HOSTED_LIVE)).join('')+'</div>';
      acts='<button class="btn ghost" id="backBtn">Back</button>'+(S.mode?'<button class="btn primary" id="nextBtn">Continue</button>':'');
    }
  }
  if(st===2){
    h='<h2 class="title">Pick your servers</h2><p class="lead">Choose as many as you need. You can change this later.</p>'+
      '<div class="toolbar"><span id="count"></span><button class="linkbtn" id="allBtn"></button></div><div class="svgrid">'+
      SERVERS.map(s=>'<button class="svc '+(S.sel.has(s.key)?'sel':'')+'" data-k="'+s.key+'"><img src="'+s.icon+'" alt="">'+
      '<span><span class="nm">'+s.name+'</span><span class="tg">'+s.tag+'</span></span><span class="ck"></span></button>').join('')+'</div>';
    acts='<button class="btn ghost" id="backBtn">Back</button><button class="btn primary" id="nextBtn">Continue</button>';
  }
  if(st===3){
    h=S.mode==='hosted'?hostedGet(a):localGet(a);
    acts='<button class="btn ghost" id="backBtn">Back</button><button class="btn ghost right" id="againBtn">Start over</button>';
  }
  $('stage').innerHTML=h; $('actions').innerHTML=acts;
  bind(); updateRecap();
}

function refreshServers(){
  document.querySelectorAll('.svc').forEach(b=>b.classList.toggle('sel',S.sel.has(b.dataset.k)));
  $('count').textContent=S.sel.size+' of '+SERVERS.length+' selected';
  $('allBtn').textContent=S.sel.size===SERVERS.length?'Clear all':'Select all';
  $('nextBtn').disabled=S.sel.size===0;
  updateRecap();
}

function bind(){
  const st=S.step;
  if($('backBtn')) $('backBtn').onclick=()=>go(st-1);
  if($('nextBtn')&&st!==2) $('nextBtn').onclick=()=>go(st+1);
  if(st===0) document.querySelectorAll('.ai').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, x=AIS.find(a=>a.k===k);
    if(S.ai!==k){S.ai=k;S.mode=(x.m.length===1&&avail(x).length===1)?x.m[0]:null;}
    render();
    setTimeout(()=>{if(S.step===0&&S.ai===k)go(1);},260);
  });
  if(st===1) document.querySelectorAll('.choice:not(.off)').forEach(b=>b.onclick=()=>{
    S.mode=b.dataset.m; render();
    if(cur().m.length>1) setTimeout(()=>{if(S.step===1)go(2);},260);
  });
  if(st===2){
    document.querySelectorAll('.svc').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k; if(S.sel.has(k)) S.sel.delete(k); else S.sel.add(k); refreshServers();});
    $('allBtn').onclick=()=>{
      if(S.sel.size===SERVERS.length) S.sel.clear(); else SERVERS.forEach(s=>S.sel.add(s.key)); refreshServers();};
    $('nextBtn').onclick=()=>go(3);
    refreshServers();
  }
  if(st===3){
    $('againBtn').onclick=()=>{S.ai=null;S.mode=null;S.sel.clear();go(0);};
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b,b.dataset.copy));
    if($('copyCfg')) $('copyCfg').onclick=()=>copyText($('copyCfg'),CFG,'Copy settings');
  }
}

function copyText(btn,text,label){
  label=label||'Copy';
  const fail=()=>{btn.textContent='Press Ctrl+C';
    const r=document.createRange();r.selectNodeContents(btn.previousElementSibling);
    const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    setTimeout(()=>btn.textContent=label,1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent=label,1200);},fail);
  }else fail();
}

function updateRecap(){
  const rc=$('recap'); if(!rc) return;
  const a=cur();
  rc.innerHTML=[['Your AI',a?a.n:'-'],['Runs',S.mode?MODE[S.mode]:'-'],['Servers',S.sel.size?S.sel.size+' selected':'-']]
    .map(r=>'<div class="rrow"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
}

/* ---------- About / FAQ / Support panel ---------- */
function srvHtml(s){
  return '<details class="srv"><summary><img src="'+s.icon+'" alt=""><span>'+s.name+'<i>'+s.tag+'</i></span></summary><div class="kv">'+
    '<span>WHAT IT DOES</span><p>'+s.does+'</p><span>HOW IT WORKS</span><p>'+s.works+'</p>'+
    '<span>BEST WAY TO USE IT</span><p>'+s.best+'</p><span>GOOD TO KNOW</span><p>'+s.know+'</p>'+
    '<span>WHAT YOU NEED</span><p>'+s.needs+'</p></div></details>';
}
function aboutHtml(){
  return '<h2>About DELIGHT</h2><p>DELIGHT MCP Servers are ten ready-made connectors that let an AI assistant work with real tools. '+
    'Each one is a small, focused program with clear limits, built in Uganda by Bryt Matech UG.</p>'+
    '<h3>How it works</h3><p>MCP is an open standard that lets an AI app use outside tools. You pick your AI and the servers you want. '+
    'Your AI then calls a server only when you ask it to do something that needs it, and the result comes straight back into the conversation.</p>'+
    '<h3>The ten servers</h3><p>Tap one to see what it does, how it works and how to get the best from it.</p>'+SERVERS.map(srvHtml).join('')+
    '<h3>Also from Bryt Matech UG</h3><p>Business Intelligence dashboards, Power BI, custom APIs, app and web development, data pipelines, '+
    'data cleaning, chatbots, data lake support and book writing. Email us to talk about your project.</p>';
}
function faqs(){
  return [
   ['What is an MCP server, in plain words?','A small program that gives your AI one specific ability, such as reading your files, checking a database or posting a Slack message. Your AI app talks to it through an open standard called MCP, and only uses it when you ask.'],
   ['Which AI apps work with DELIGHT servers?','Any app that supports MCP. Claude, Cursor, GitHub Copilot (in VS Code), Claude Code, Windsurf, Gemini CLI, Codex CLI, Antigravity, Cline and Zed run servers on your computer. ChatGPT and Microsoft Copilot Studio connect to hosted servers only. Pick yours on the first screen and we show only what it supports. If your app is not listed but supports MCP, choose Other MCP app. Some free plans do not allow custom servers, so check yours.'],
   ['What is the difference between Local and Hosted?',HOSTED_LIVE
     ?'Local servers run on your own computer: free, and your data stays with you, but you set them up once. Hosted servers run on our side: nothing to install, always on, and you paste a link into your AI app.'
     :'Local servers run on your own computer: free, and your data stays with you, but you set them up once. Hosted servers would run on our side with nothing to install. They are not live yet, so every AI that can run servers on your computer works today, while ChatGPT and Copilot Studio have to wait. Choose them on the first screen and use Notify me to hear when hosted opens.'],
   ['I downloaded a server. How do I set it up?','Unzip it, open a terminal in that folder and run <code>npm install</code> then <code>npm run build</code>. Then add it to your AI app\'s MCP settings with <code>node</code> as the command and the full path to <code>dist/index.js</code> as the argument, and fully restart the app. The Get started step writes that settings text for you. You need Node.js 18 or newer.'],
   ['It says "node" or "npm" is not recognized.','Node.js is not installed, or the terminal was opened before it was. Install the LTS version from nodejs.org, close the terminal completely, open a new one and run <code>node --version</code>. You need version 18 or newer.'],
   ['npm install or npm run build fails. What do I check?','First run <code>node --version</code> (18 or newer). Then delete the folder\'s <code>node_modules</code> and run <code>npm install</code> again. Work from a folder you own, such as Documents or a D: folder, not Program Files. Browser Pilot downloads a browser of about 200 MB while installing, so on a slow connection let it finish or retry. If it still fails, email us the full error text.'],
   ['My AI app does not show the server or its tools.','Fully quit and reopen the app (check the system tray, closing the window is not enough). Make sure the path points to <code>dist/index.js</code>, not src, uses the full path, and the settings file is valid JSON with no trailing commas. To find out whether the server or the app is at fault, run <code>npx @modelcontextprotocol/inspector node dist/index.js</code> in the server folder. If it connects there, the server is fine and the app\'s settings need fixing.'],
   ['It says a key or token is missing.','GitHub, Database and Payments need credentials, passed as settings called environment variables: <code>GITHUB_TOKEN</code>, <code>DATABASE_URL</code> and <code>STRIPE_SECRET_KEY</code>. Put them in the <code>env</code> section of that server\'s entry in your AI app\'s settings, never in a chat. Use read-only or restricted keys whenever the provider offers them.'],
   ['How does the Slack, Drive or Notion sign-in work?','You sign in once. On first run the server prints a link in its log (the terminal, or the Console tab in the Inspector). Open it, approve access, and the token is saved in a file on your computer. Each one uses a local return address that must be registered in its developer settings: <code>http://127.0.0.1:8734/callback</code> for Slack, <code>8735</code> for Drive and <code>8736</code> for Notion. If sign-in gets stuck or expires, delete the saved token file (for example <code>.slack-tokens.json</code>) and run it again.'],
   ['Is it safe? What can the AI change?','Local servers keep your data on your computer. GitHub, Database, Drive and Notion are read-only. Anything that changes things is guarded: Filesystem can write and delete only inside the folder you choose; Slack posting and Stripe writes stay off until you turn them on; refunds also need confirmation every time; and Stripe refuses live keys unless you explicitly allow them. Still, only give a server access you are comfortable with, and review what your AI is about to do.']
  ];
}
function faqHtml(){
  return '<h2>FAQ</h2><p>The ten questions we hear most, with the fix.</p>'+
    faqs().map(f=>'<details class="faq"><summary>'+f[0]+'</summary><div class="ans"><p>'+f[1]+'</p></div></details>').join('');
}
function supportHtml(){
  return '<h2>Support</h2><p>Email us and we will help you get set up.</p><div class="contact">'+
    SUPPORT.map(e=>'<a href="mailto:'+e+'">'+e+'<span>Email</span></a>').join('')+
    '<a href="tel:'+PHONE_TEL+'">'+PHONE+'<span>Call</span></a></div>'+
    '<h3>Include these so we can help faster</h3><ul><li>Which server, and which AI app</li><li>Windows, Mac or Linux</li>'+
    '<li>The exact error text, or a screenshot</li><li>What you were trying to do</li></ul>'+
    '<p>Built in Uganda by Bryt Matech UG.</p>';
}
function openSheet(tab){
  const body=tab==='faq'?faqHtml():tab==='support'?supportHtml():aboutHtml();
  $('sheet').innerHTML='<div class="sheethead"><div class="tabs">'+
    [['about','About'],['faq','FAQ'],['support','Support']].map(t=>'<button class="tab '+(t[0]===tab?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+
    '</div><button class="x" id="closeX" aria-label="Close">&times;</button></div><div class="sheetbody">'+body+'</div>';
  $('sheet').classList.add('open'); $('shade').classList.add('show');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openSheet(b.dataset.tab));
  $('closeX').onclick=closeSheet;
}
function closeSheet(){$('sheet').classList.remove('open');$('shade').classList.remove('show');}

$('sidenav').innerHTML=[['about','About'],['faq','FAQ'],['support','Support']].map(t=>'<button data-open="'+t[0]+'">'+t[1]+'</button>').join('');
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));
$('shade').onclick=closeSheet;
if(document.addEventListener) document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
render();
</script>
</body></html>
