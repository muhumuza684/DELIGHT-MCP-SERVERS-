  return '<div class="hd"><span class="ic">'+ico(h.icon,34)+'</span><div><h2>'+h.name+'</h2><p class="tag">'+h.tag+'</p></div></div>'+
   '<div class="row">'+(h.ready?'<button class="btn blue" data-act="connect">Get '+esc(h.name)+'</button><span class="chip c-ok">Free</span><span class="chip c-info">Test mode included</span>':'<a class="btn pri" href="'+MAILTO+encodeURIComponent('Notify me: '+h.name+' is ready')+'">Tell me when it is ready</a><span class="chip c-soon">Coming soon</span>')+'</div>'+
   '<div class="cols2"><div class="sec"><h3>It can</h3><ul>'+h.can.map(i=>'<li>'+OKI+'<span>'+esc(i)+'</span></li>').join('')+'</ul></div><div class="sec"><h3>It cannot</h3><ul>'+h.cant.map(i=>'<li class="no">'+NOI+'<span>'+esc(i)+'</span></li>').join('')+'</ul></div></div>'+
   '<div class="know"><b>Good to know:</b> '+esc(h.know)+'</div>'+
   '<div class="sec"><h3>What you need</h3><ul><li>'+OKI+'<span>Node.js, free and installed once.</span></li><li>'+OKI+'<span>'+esc(h.needs)+'</span></li></ul></div>'+
   '<div class="sec"><h3>Privacy and support</h3><ul><li>'+OKI+'<span>It runs on your computer. Your data stays with you.</span></li><li>'+OKI+'<span>Support: '+SUPPORT+'</span></li></ul></div>'+
      '<div class="rev"><b>Reviews:</b> none yet. We will not invent any.</div>';
}
function acts(rows){
  return '<ol class="acts">'+rows.map((r,i)=>{const st=i<S.stage?'done':i===S.stage?'active':'next';
   return '<li class="act '+st+'"><span class="an">'+(st==='done'?OKI:i+1)+'</span><div class="ab"><h3>'+r.t+'</h3>'+(st==='done'?'<p class="sm2">'+r.sum+'</p>':st==='active'?r.body:'')+'</div></li>';}).join('')+'</ol>';
}
function fixHTML(){
  const L=S.path==='api'?AISSUES:ISSUES;
  const c=L.find(i=>i.k===S.issue);
  return '<div class="fix"><b>What happened?</b><div class="fixg">'+L.map(i=>'<button data-act="issue" data-k="'+i.k+'" aria-pressed="'+(S.issue===i.k)+'">'+i.t+'</button>').join('')+'</div>'+
   (c?'<div class="fixa"><b>Try this:</b> '+esc(c.f())+'</div><div class="row"><button class="btn good" data-act="fixed">That fixed it</button><a class="btn ghost" href="'+MAILTO+encodeURIComponent('Hello, I need help. Problem: '+c.t+'. Helper: '+helper().name+'. Computer: '+OSN[S.os]+(S.path==='api'?'.':'. AI: '+aiN()+'.'))+'">Still stuck? Send to us</a></div>':'')+'</div>';
}
function flowHTML(){
  const h=helper(), a=aiO(), X=OSX[S.os];
  let body;
  if(a.mode==='one'&&h.oneclick){
    if(S.stage>=4){
      body='<div class="win"><div class="ck">'+BIGOK+'</div><h2>You are connected.</h2><p class="note">'+esc(h.name)+' now works in '+esc(a.n)+'.</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="more">Add another helper</button><a class="btn ghost" href="'+MAILTO+encodeURIComponent('Hello, I am connected to '+h.name+' and have a question.')+'">Ask us anything</a></div></div>';
    }else{
      body=acts([
       {t:'Download',sum:'Downloaded',body:'<p class="t2">One small file. It works on '+(S.os==='mac'?'your Mac':'your Windows PC')+'.</p>'+
          (S.os==='mac'?'<p class="t2">Mac note: we have tested on Windows so far. If anything looks different on your Mac, email us and we will sort it out.</p>':'')+
          '<div class="go"><a class="btn blue" data-act="adv" href="'+DL_DIR+h.file+'" download>Download '+h.file+'</a></div>'},
       {t:'Open it',sum:'Installed',body:'<p class="t2">Open '+esc(a.n)+', go to <b>Settings</b>, then <b>Extensions</b>. Drag <b>'+h.file+'</b> from your '+X.dl+' into that window, then click <b>Install</b>.</p><p class="t2">No place to drag it? In Extensions, choose <b>Advanced settings</b>, then <b>Install Extension</b>, and pick the file.</p><p class="t2">Double-clicking the file works on some computers. If Windows asks which app to open it with, close that box and use the steps above. Do not pick Word or Notepad.</p><div class="go"><button class="btn blue" data-act="adv">I clicked Install</button></div>'},
       {t:'Answer its question',sum:'Done',body:'<p class="t2">'+(h.asks?'It will ask you to '+esc(h.asks)+'.':'There is nothing to answer for this helper.')+'</p><div class="go"><button class="btn blue" data-act="adv">Done</button></div>'},
       {t:'Try it',sum:'',body:'<p class="t2">Ask '+esc(a.n)+' this:</p><div class="say"><q>'+esc(h.say)+'</q><button class="btn ghost sm" data-act="copy" data-text="'+esc(h.say)+'">Copy</button></div><div class="two"><button class="btn good" data-act="worked">It worked</button><button class="btn badb" data-act="wrong">Something is wrong</button></div>'+(S.bad?fixHTML():'')}
      ]);
    }
  }else if(a.mode==='one'){
    body='<div class="know" style="margin-top:14px"><b>This one needs a little more setup.</b> '+esc(h.why)+' The quickest way is to let us do it with you.</div>'+
     '<div class="row"><a class="btn pri" href="'+MAILTO+encodeURIComponent('Hello, please help me set up "'+h.name+'" in '+a.n+'. Computer: '+OSN[S.os]+'.')+'">Set it up with me by email</a></div>';
  }else{
    body='<div class="panel" style="margin-top:14px;background:#0F172A;color:#fff;border-color:#0F172A"><h3 style="color:#fff">DELIGHT Setup helper <span class="chip c-soon" style="color:#D6DEF5;border-color:#7C8BB5">Coming soon</span></h3><p style="color:#D6DEF5;margin-top:8px">One small app that connects '+esc(h.name)+' to '+esc(a.n)+' for you.</p></div>'+
     '<div class="row"><a class="btn pri" href="'+MAILTO+encodeURIComponent('Hello, please help me connect "'+h.name+'" to '+a.n+'. Computer: '+OSN[S.os]+'.')+'">Set it up with me by email</a></div>';
  }
  return '<div class="det"><button class="link" data-act="cancel">\u2190 Back to '+esc(h.name)+'</button><h2 style="margin-top:6px">Connect '+esc(h.name)+' to '+esc(a.n)+'</h2>'+body+'</div>';
}
function aflowHTML(){
  const h=helper(), X=OSX[S.os], win=S.os==='win', start=win?'START.bat':'START.command', url='http://localhost:'+h.port+'/health';
  let body;
  if(S.stage>=4){
    body='<div class="win"><div class="ck">'+BIGOK+'</div><h2>Your API is running.</h2><p class="note">'+esc(h.name)+' works on your computer. For customers to use it, it needs to go online.</p><div class="row" style="justify-content:center"><a class="btn pri" href="'+MAILTO+encodeURIComponent('Hello, I have '+h.name+' running and want to put it online.')+'">Put it online with us</a><button class="btn ghost" data-act="more">Add another API</button></div></div>';
  }else{
    body=acts([
     {t:'Download',sum:'Downloaded',body:'<p class="t2">One zip with everything inside. You also need <a href="https://nodejs.org" target="_blank" rel="noopener">Node.js</a>, which is free and installed once. Already have it? Carry on.</p>'+
        (S.os==='mac'?'<p class="t2">Mac note: we have tested on Windows so far. If anything looks different on your Mac, email us and we will sort it out.</p>':'')+
        '<div class="go"><a class="btn blue" data-act="adv" href="'+DL_DIR+h.file+'" download>Download '+h.file+'</a></div>'},
     {t:'Start it',sum:'Started',body:'<p class="t2">'+(win?'Open '+X.fm+', go to your '+X.dl+', right-click <b>'+h.file+'</b> and choose <b>Extract All</b>.':'Open '+X.fm+', go to your '+X.dl+' and double-click <b>'+h.file+'</b> to unpack it.')+' Open the new folder and double-click <b>'+start+'</b>.</p><p class="t2">A black window opens and stays open. That window is your API running. '+(win?'If Windows asks whether to run it, choose Run.':'If macOS blocks it, right-click '+start+', choose Open, then Open again.')+'</p><div class="go"><button class="btn blue" data-act="adv">It is running</button></div>'},
     {t:'Check it',sum:'Alive',body:'<p class="t2">Open this link. You should see the word <b>ok</b>.</p><div class="say"><q>'+url+'</q><a class="btn ghost sm" href="'+url+'" target="_blank" rel="noopener">Open</a></div><div class="go"><button class="btn blue" data-act="adv">I see ok</button></div>'},
     {t:'Use it',sum:'',body:'<p class="t2">Your secret key is shown in the black window and saved in the file <code>.env</code>. Inside the folder, <code>postman_collection.json</code> lets you click-test every request.</p><div class="two"><button class="btn good" data-act="worked">It worked</button><button class="btn badb" data-act="wrong">Something is wrong</button></div>'+(S.bad?fixHTML():'')}
    ]);
  }
  return '<div class="det"><button class="link" data-act="cancel">\u2190 Back to '+esc(h.name)+'</button><h2 style="margin-top:6px">Get '+esc(h.name)+' running</h2>'+body+'</div>';
}
function chatHTML(){
  const a=aiO(), h=H[0], c=S.chat;
  return '<p class="lbl">How it feels inside '+esc(a.n)+' (our own illustration)</p><div class="chat" style="margin-top:14px"><div class="u">Which of my products sold the least in October? The sheet is in my AI-files folder.</div>'+
   (c?'<div class="aib"><b>Connected to DELIGHT Files.</b><p style="margin-top:6px">Your three slowest sellers:</p><table><thead><tr><th>Product</th><th>Units</th></tr></thead><tbody><tr><td>Desk calendars</td><td>9</td></tr><tr><td>Staplers</td><td>14</td></tr><tr><td>Folders (red)</td><td>17</td></tr></tbody></table><p style="color:var(--ok);font-weight:800">Made-up data.</p></div>'
     :'<div class="aib">I can answer this by reading your sheet, if you connect a file helper.<div class="sug"><span style="width:44px;height:44px;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center">'+ico(h.icon,24)+'</span><div style="flex:1;min-width:180px"><b>DELIGHT Files</b><br><span style="color:var(--muted);font-size:14.5px">Reads files in one folder you choose. Free.</span></div><button class="btn blue sm" data-act="chatconn">Connect</button><button class="btn ghost sm" data-act="chatno">Not now</button></div></div>')+'</div>';
}
function hubHTML(){
  const L=S.path==='api'?AHUB:HUB;
  const a=L.find(x=>x.k===S.hub);
  return '<p class="lbl">Help, in plain words</p><div class="hubs" style="margin-top:12px">'+L.map(h=>'<button class="hb" data-act="hub" data-k="'+h.k+'" aria-pressed="'+(S.hub===h.k)+'"><b>'+esc(h.t())+'</b><span>'+h.d+'</span></button>').join('')+'</div>'+
   (a?'<div class="ans"><b>'+esc(a.t())+'</b><p style="margin-top:8px">'+esc(a.a())+'</p><div class="row"><a class="btn pri" href="'+MAILTO+'Hello%2C%20I%20need%20help%20with%20DELIGHT.">Email us</a></div></div>':'');
}
function sApp(){
  const tabs=[['helpers','Helpers'],['chat','See it in a chat'],['help','Help']];
  let main;
  if(S.tab==='helpers'){
    main='<div class="dir"><div class="pnl"><input class="search" id="q" type="search" placeholder="Search, e.g. spreadsheet" value="'+esc(S.q)+'" aria-label="Search helpers"><ul class="res" id="lst">'+listHTML()+'</ul></div><div class="pnl" id="det">'+(S.flow?flowHTML():detailHTML())+'</div></div>';
  }else if(S.tab==='chat') main='<div class="pnl">'+chatHTML()+'</div>';
  else main='<div class="pnl">'+hubHTML()+'</div>';
  return '<section class="hello" style="padding-bottom:0"><h1 style="font-size:clamp(28px,4.4vw,40px)">MCP helpers: pick one.</h1></section>'+recap()+
   '<div class="tabs" role="group" aria-label="Sections">'+tabs.map(t=>'<button data-act="tab" data-k="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('')+'</div>'+main;
}
function sAPI(){
  const tabs=[['helpers','APIs'],['help','Help']];
  const rc='<div class="recap"><span class="rc"><small>Computer</small><b>'+OSN[S.os]+'</b><button class="chg" data-act="chgos">Change</button></span>'+
   '<span class="rc"><small>You chose</small><b>API: ready-made back-ends</b><button class="chg" data-act="chgpath">Change</button></span></div>';
  let main;
  if(S.tab==='helpers'){
    main='<div class="dir"><div class="pnl"><input class="search" id="q" type="search" placeholder="Search, e.g. payments" value="'+esc(S.q)+'" aria-label="Search APIs"><ul class="res" id="lst">'+listHTML()+'</ul></div><div class="pnl" id="det">'+(S.flow&&helper().ready?aflowHTML():adetailHTML())+'</div></div>';
  }else main='<div class="pnl">'+hubHTML()+'</div>';
  return '<section class="hello" style="padding-bottom:0"><h1 style="font-size:clamp(28px,4.4vw,40px)">APIs: pick one.</h1></section>'+rc+
   '<div class="tabs" role="group" aria-label="Sections">'+tabs.map(t=>'<button data-act="tab" data-k="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('')+'</div>'+main;
}
function navHTML(){
  if(S.step==='path') return '';
  return '<div class="navbar"><button class="nb" data-act="back">'+ico('<path d="M15 6l-6 6 6 6"/>',20)+'<span>Back</span></button></div>';
}
function goBack(){
  if(S.flow){S.flow=false;S.stage=0;S.bad=false;S.issue=null;render();return;}
  if((S.step==='app'||S.step==='api')&&S.tab!=='helpers'){S.tab='helpers';render();return;}
  const to={os:'path',ai:'os',app:'ai',api:'os',phone:'os',other:'os',noai:'ai'}[S.step]; if(!to) return;
  if(to==='path') S.path=null; if(to==='os'){S.os=null;S.ai=null;} if(to==='ai') S.ai=null;
  S.step=to; S.tab='helpers'; S.hub=null; S.q=''; render(); window.scrollTo({top:0});
}
function render(){
  $('#app').innerHTML=navHTML()+({path:sPath,os:sOS,other:sOther,phone:sPhone,ai:sAI,noai:sNoAI,app:sApp,api:sAPI}[S.step])();
}
function copyText(btn,text){const l=btn.textContent;const d=()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent=l,1300)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(d,()=>{btn.textContent='Press Ctrl+C'})}else{btn.textContent='Press Ctrl+C'}}
document.addEventListener('input',e=>{const t=e.target; if(t&&t.id==='q'){S.q=t.value; const l=$('#lst'); if(l) l.innerHTML=listHTML();}});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  const d=t.dataset;
  switch(d.act){
    case 'path': S.path=d.k; S.sel=d.k==='api'?'sign':'files'; S.tab='helpers'; S.flow=false; S.stage=0; S.bad=false; S.issue=null; S.hub=null; S.q='';
      S.step=!S.os?'os':(S.os==='phone'?'phone':(d.k==='api'?'api':'ai')); render(); window.scrollTo({top:0}); break;
    case 'chgpath': S.path=null; S.flow=false; S.step='path'; render(); window.scrollTo({top:0}); break;
    case 'os': S.os=d.k; S.step=(d.k==='phone')?'phone':(S.path==='api'?'api':'ai'); render(); window.scrollTo({top:0}); break;
    case 'osother': S.step='other'; render(); break;
    case 'chgos': S.os=null; S.ai=null; S.step='os'; S.flow=false; render(); window.scrollTo({top:0}); break;
    case 'ai': S.ai=d.k; S.step='app'; S.tab='helpers'; S.flow=false; S.stage=0; S.bad=false; render(); window.scrollTo({top:0}); break;
    case 'noai': S.step='noai'; render(); break;
    case 'chgai': S.ai=null; S.step='ai'; S.flow=false; render(); window.scrollTo({top:0}); break;
    case 'tab': S.tab=d.k; render(); break;
    case 'pick': S.sel=d.k; S.flow=false; render(); {const el=$('#det'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'nearest'});} break;
    case 'connect': S.flow=true; S.stage=0; S.bad=false; S.issue=null; render(); break;
    case 'cancel': S.flow=false; render(); break;
    case 'adv': S.stage=Math.min(3,S.stage+1); setTimeout(()=>render(),0); break;
    case 'worked': S.stage=4; render(); break;
    case 'wrong': S.bad=true; render(); break;
    case 'issue': S.issue=d.k; render(); break;
    case 'fixed': S.bad=false; S.issue=null; S.stage=4; render(); break;
    case 'more': S.flow=false; S.stage=0; render(); break;
    case 'home': e.preventDefault(); S.path=null; S.flow=false; S.step='path'; S.stage=0; S.bad=false; S.issue=null; S.tab='helpers'; S.hub=null; S.q=''; render(); window.scrollTo({top:0}); break;
    case 'back': goBack(); break;
    case 'copy': copyText(t,d.text); break;
    case 'chatconn': S.chat=true; render(); break;
    case 'chatno': S.chat=false; render(); break;
    case 'hub': S.hub=d.k; render(); break;
  }
});
S.guess=detectOS(typeof navigator!=='undefined'&&navigator.userAgent);
(function(){const m=(location.hash||'').replace('#','').split(':');if(m[0]==='mcp'||m[0]==='api'){S.path=m[0];S.sel=(m[1]&&SRC().some(h=>h.k===m[1]))?m[1]:(m[0]==='api'?'sign':'files');S.step='os';}})();
render();
</script>
</body>
</html>
